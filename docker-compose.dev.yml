# Development overrides for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --loglevel verbose

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      REDIS_CONNECTION_STRING: "redis:6379"
      FASTAPI_BASE_URL: http://predictor:8000
      GROQCLOUD_API_KEY: ${GROQCLOUD_API_KEY}
      GROQCLOUD_MODEL: ${GROQCLOUD_MODEL:-llama-3.3-70b-versatile}
      GROQCLOUD_BASE_URL: ${GROQCLOUD_BASE_URL:-https://api.groq.com/openai/v1}
      GROQCLOUD_TEMPERATURE: ${GROQCLOUD_TEMPERATURE:-0.7}
      GROQCLOUD_MAX_TOKENS: ${GROQCLOUD_MAX_TOKENS:-4096}
      GROQCLOUD_TIMEOUT_SECONDS: ${GROQCLOUD_TIMEOUT_SECONDS:-30}
      GROQCLOUD_MAX_RETRIES: ${GROQCLOUD_MAX_RETRIES:-3}
    depends_on:
      - predictor
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    ports:
      - "5000:80"
      - "5002:443"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      VUE_APP_API_BASE_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:8080"

  predictor:
    build:
      context: ./predictor
      dockerfile: Dockerfile.dev
    environment:
      PYTHONPATH: /app
      FASTAPI_ENV: development
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./predictor:/app
    ports:
      - "8000:8000"